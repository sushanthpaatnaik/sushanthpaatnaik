<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Light-native plate for Engage: a desk signal — one origin point right of
       the reading column, concentric correspondence arcs radiating outward,
       a few gold waypoints. Quiet linework for the paper canvas, same family
       as the Contact star chart and the Ventures orbit. -->
