<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Light-native plate for Contact: a star chart, the paper counterpart of
       the dark theme's space scene. Fine graphite orbits, gold nodes and a
       quiet constellation, drawn for the warm near-white canvas. Intensity is
       deliberately low: it gives the page a celestial feel while text reads
       as easily as on plain paper. -->
  <g fill="none">
    <!-- orbital rings, right of the reading column -->
    <circle cx="1150" cy="420" r="170" stroke="#5c564a" stroke-width="1" opacity="0.20"/>
    <circle cx="1150" cy="420" r="300" stroke="#5c564a" stroke-width="1" stroke-dasharray="2 7" opacity="0.16"/>
    <circle cx="1150" cy="420" r="440" stroke="#5c564a" stroke-width="1" opacity="0.11"/>
    <circle cx="150" cy="880" r="270" stroke="#5c564a" stroke-width="1" opacity="0.07"/>

    <!-- sweeping trajectory arcs -->
    <path d="M -60 920 Q 620 640 1660 240" stroke="#5c564a" stroke-width="1" stroke-dasharray="1 6" opacity="0.13"/>
    <path d="M -60 1010 Q 720 800 1660 470" stroke="#5c564a" stroke-width="1" opacity="0.08"/>

    <!-- meridian hairlines -->
    <path d="M 1150 120 L 1150 760" stroke="#5c564a" stroke-width="1" opacity="0.07"/>
    <path d="M 830 420 L 1470 420" stroke="#5c564a" stroke-width="1" opacity="0.07"/>

    <!-- constellation, upper right -->
    <polyline points="1030,180 1110,138 1190,192 1262,150 1312,222 1230,262"
              stroke="#8a6f3c" stroke-width="1" opacity="0.34"/>
    <g fill="#a8823f" stroke="none">
      <circle cx="1030" cy="180" r="3.4" opacity="0.60"/>
      <circle cx="1110" cy="138" r="4.2" opacity="0.66"/>
      <circle cx="1190" cy="192" r="3.0" opacity="0.55"/>
      <circle cx="1262" cy="150" r="3.8" opacity="0.62"/>
      <circle cx="1312" cy="222" r="3.0" opacity="0.55"/>
      <circle cx="1230" cy="262" r="4.4" opacity="0.66"/>
    </g>
    <g fill="none" stroke="#a8823f" stroke-width="1">
      <circle cx="1110" cy="138" r="9" opacity="0.22"/>
      <circle cx="1230" cy="262" r="10" opacity="0.22"/>
    </g>

    <!-- constellation, lower -->
    <polyline points="980,640 1062,600 1142,662 1224,620"
              stroke="#8a6f3c" stroke-width="1" opacity="0.24"/>
    <g fill="#a8823f" stroke="none">
      <circle cx="980" cy="640" r="2.8" opacity="0.45"/>
      <circle cx="1062" cy="600" r="3.4" opacity="0.52"/>
      <circle cx="1142" cy="662" r="2.8" opacity="0.45"/>
      <circle cx="1224" cy="620" r="3.4" opacity="0.52"/>
    </g>

    <!-- orbit nodes -->
    <g fill="#a8823f" stroke="none">
      <circle cx="1150" cy="250" r="3.6" opacity="0.55"/>
      <circle cx="1320" cy="420" r="3.0" opacity="0.45"/>
      <circle cx="920"  cy="300" r="2.6" opacity="0.40"/>
      <circle cx="1450" cy="330" r="2.6" opacity="0.38"/>
    </g>

    <!-- scattered stars -->
    <g fill="#5c564a" stroke="none">
      <circle cx="900"  cy="150" r="1.6" opacity="0.30"/>
      <circle cx="990"  cy="90"  r="1.3" opacity="0.24"/>
      <circle cx="1210" cy="70"  r="1.6" opacity="0.30"/>
      <circle cx="1380" cy="120" r="1.3" opacity="0.24"/>
      <circle cx="1490" cy="210" r="1.6" opacity="0.30"/>
      <circle cx="1420" cy="520" r="1.6" opacity="0.28"/>
      <circle cx="1330" cy="700" r="1.3" opacity="0.24"/>
      <circle cx="1050" cy="780" r="1.6" opacity="0.26"/>
      <circle cx="860"  cy="520" r="1.3" opacity="0.22"/>
      <circle cx="760"  cy="240" r="1.3" opacity="0.20"/>
      <circle cx="1540" cy="640" r="1.6" opacity="0.26"/>
      <circle cx="1170" cy="880" r="1.3" opacity="0.22"/>
    </g>
    <g stroke="#a8823f" stroke-width="1" opacity="0.30">
      <path d="M 960 350 l 0 10 M 955 355 l 10 0"/>
      <path d="M 1360 560 l 0 10 M 1355 565 l 10 0"/>
      <path d="M 1280 80  l 0 10 M 1275 85  l 10 0"/>
    </g>

    <!-- ring cardinal ticks -->
    <g stroke="#5c564a" stroke-width="1" opacity="0.18">
      <path d="M 1150 244 l 0 12"/>
      <path d="M 1150 584 l 0 12"/>
      <path d="M 974 420 l 12 0"/>
      <path d="M 1314 420 l 12 0"/>
    </g>
  </g>
</svg>
