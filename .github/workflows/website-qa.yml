name: Website QA — source, build, and Cloudflare publication

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      send_contact_test:
        type: boolean
        description: "Send one clearly labelled QA message through Web3Forms"
        required: false
        default: false

permissions:
  contents: read

jobs:
  source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check copy, form contract, metadata and sitemap
        run: node scripts/qa-site.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Compile production application
        run: npm run build

  cloudflare-live-smoke:
    needs: source-and-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check published routes after Cloudflare deployment
        env:
          QA_BASE_URL: "https://sushanthpaatnaik.com"
          QA_ATTEMPTS: "10"
          QA_INTERVAL_MS: "25000"
          QA_SEND_CONTACT_TEST: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[site-contact-test]')) || (github.event_name == 'workflow_dispatch' && inputs.send_contact_test) }}
        run: node scripts/qa-site.mjs --remote
